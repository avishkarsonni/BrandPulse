version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: brandpulse-database
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=brandpulse
      - MYSQL_USER=brandpulse_user
      - MYSQL_PASSWORD=brandpulse_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql:ro
    networks:
      - brandpulse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "brandpulse_user", "-pbrandpulse_password"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandpulse-backend
    environment:
      - DATABASE_URL=mysql://brandpulse_user:brandpulse_password@database:3306/brandpulse
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service_account.json
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://frontend:80
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/service_account.json:/app/service_account.json:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - brandpulse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: brandpulse-frontend
    environment:
      - REACT_APP_API_URL=http://brandpulse-backend:8000
      - REACT_APP_WS_URL=ws://brandpulse-backend:8000
      - NODE_ENV=production
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - brandpulse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Database API Service (separate microservice for database operations)
  database-api:
    build:
      context: ./database-api
      dockerfile: Dockerfile
    container_name: brandpulse-database-api
    environment:
      - DATABASE_URL=mysql://brandpulse_user:brandpulse_password@database:3306/brandpulse
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=brandpulse_user
      - DB_PASSWORD=brandpulse_password
      - DB_NAME=brandpulse
      - API_PORT=8002
      - LOG_LEVEL=info
    ports:
      - "8001:8002"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - brandpulse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching (optional but recommended for production)
  redis:
    image: redis:7-alpine
    container_name: brandpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - brandpulse-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Nginx Load Balancer (optional for production)
  nginx:
    image: nginx:alpine
    container_name: brandpulse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - database-api
    networks:
      - brandpulse-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  brandpulse-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
